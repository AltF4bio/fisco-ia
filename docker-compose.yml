services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fisco
      POSTGRES_USER: fisco
      POSTGRES_PASSWORD: fisco
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisco -d fisco"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://fisco:fisco@db:5432/fisco
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      FISCO_MODO_DEMO: ${FISCO_MODO_DEMO:-True}
      FISCO_SEED_DEMO: ${FISCO_SEED_DEMO:-False}
      FISCO_SESSION_CACHE_DIR: /tmp/fisco-ia-sessoes
    volumes:
      - webdata:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  webdata:
