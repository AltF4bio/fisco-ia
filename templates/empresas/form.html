{% extends "base.html" %}
{% block titulo %}{% if object %}Editar empresa{% else %}Nova empresa{% endif %}{% endblock %}
{% block conteudo %}
<h1 class="titulo-pagina h3 mb-3">{% if object %}Editar empresa{% else %}Nova empresa{% endif %}</h1>
<div class="card" style="max-width: 640px;">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_campos.html" %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
        <a href="{% if object %}{% url 'empresas:detalhe' object.pk %}{% else %}{% url 'empresas:lista' %}{% endif %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
