{% url url_nome as destino %}{% if destino %}
<div class="col-sm-6 col-lg-3">
  <a href="{{ destino }}" class="card atalho h-100 text-decoration-none text-reset">
    <div class="card-body">
      <i class="bi bi-{{ icone }}"></i>
      <h2 class="h6 fw-bold mt-2 mb-1">{{ titulo }}</h2>
      <p class="small text-secondary mb-0">{{ texto }}</p>
    </div>
  </a>
</div>
{% endif %}
