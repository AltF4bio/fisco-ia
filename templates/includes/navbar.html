{% with rota=request.resolver_match.namespace %}
<nav class="navbar navbar-expand-lg navbar-fisco" data-bs-theme="dark">
  <div class="container-xl">
    <a class="fisco-logo" href="{% url 'painel' %}">
      <span class="marca">F</span><span>FISCO<span class="ia">.IA</span></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'painel' %}active{% endif %}" href="{% url 'painel' %}">Painel</a></li>
        {% if eh_procurador %}
        {% endif %}
        {% if eh_administrador %}
          <li class="nav-item"><a class="nav-link {% if rota == 'contas' %}active{% endif %}" href="{% url 'contas:usuarios' %}">Usuários</a></li>
        {% endif %}
      </ul>
      <div class="d-flex align-items-center gap-3 text-white-50 small">
        <span><i class="bi bi-person-circle"></i> {{ user.get_full_name|default:user.username }} <span class="badge text-bg-secondary">{{ perfil_usuario }}</span></span>
        <form method="post" action="{% url 'contas:logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-light" type="submit"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </form>
      </div>
    </div>
  </div>
</nav>
{% endwith %}
